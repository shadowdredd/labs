<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Таблиця 5x4</title>
  <style>
    table {
      border: 6px double #2980B9;
      background-color: #EBF5FB;
      float: right;
      margin: 20px;
    }
    td {
      border: 2px solid #2980B9;
      padding: 10px;
      font-family: Arial;
      font-size: 14px;
    }
    tr:nth-child(even) td {
      background-color: #F2F3F4;
    }
    tr:nth-child(odd) td {
      background-color: #EBF5FB;
    }
    th {
      background-color: #2980B9;
      color: white;
      padding: 10px;
      border: 2px solid #2980B9;
      font-family: Arial;
    }
  </style>
</head>
<body bgcolor="#F5F5F5">

</html>
