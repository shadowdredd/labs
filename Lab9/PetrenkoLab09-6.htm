<!DOCTYPE html>
<html>
<head>
    <title>Мої друзі — Одногрупники</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Georgia, serif; background: #fafafa; padding: 24px; }
        h1 { text-align: center; color: #37474f; }
        p.hint { text-align: center; color: #888; font-size: 13px; margin-bottom: 30px; }
        .grid { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; }
        .card { background: white; border: 1px solid #e0e0e0; border-radius: 6px; padding: 16px; text-align: center; width: 380px; }
        .card img { border: 2px solid #78909c; display: block; margin: 0 auto; cursor: crosshair; }
        .card h3 { margin: 10px 0 4px; font-size: 15px; color: #263238; }
        .card p { font-size: 12px; color: #777; margin: 2px 0; }
    </style>
</head>
<body>
<h1>👥 Мої друзі — Одногрупники</h1>
<p class="hint">Наведіть курсор на фото — з'явиться інформація про друга</p>

<div class="grid">

    <!-- ДРУГ 1 -->
    <div class="card">
        <map name="mapF1">
            <area shape="rect" coords="0,0,360,225" href="#" title="Дмитро — відмінник групи, допомагає з лабораторними">
            <area shape="rect" coords="0,225,360,450" href="#" title="Дмитро захоплюється Brawl Stars та програмуванням">
        </map>
        <img src="images9/friend1.jpg" width="360" height="450" usemap="#mapF1">
        <h3>Дмитро Віскривець</h3>
        <p> Відмінник</p>
        <p>Brawl Stars, програмування</p>
    </div>

    <!-- ДРУГ 2 -->
    <div class="card">
        <map name="mapF2">
            <area shape="circle" coords="180,150,130" href="#" title="Марія — активіст самоврядування та фотограф">
            <area shape="rect"   coords="0,320,360,450" href="#" title="Марія подорожує Україною і робить чудові фото природи">
        </map>
        <img src="images9/friend2.jpg" width="360" height="450" usemap="#mapF2">
        <h3>Євгеній Ткач</h3>
        <p>Відмінник</p>
        <p>Brawl stars, музика</p>
    </div>

    <!-- ДРУГ 3 -->
    <div class="card">
        <map name="mapF3">
            <area shape="poly" coords="0,0,360,0,360,225,180,450,0,225" href="#" title="Дмитро — капітан студентської футбольної команди">
            <area shape="rect" coords="0,225,360,450" href="#" title="Дмитро займається футболом та плаванням">
        </map>
        <img src="images9/friend3.jpg" width="360" height="450" usemap="#mapF3">
        <h3>Владислав Пальчик</h3>
        <p>Тренажерний зал</p>
        <p>Dota 2, турнікмен</p>
    </div>

    <!-- ДРУГ 4 -->
    <div class="card">
        <map name="mapF4">
            <area shape="rect"   coords="0,0,360,225"   href="#" title="Анастасія — переможниця конкурсу поезії університету">
            <area shape="circle" coords="180,340,110"   href="#" title="Настя грає на гітарі та пише вірші">
        </map>
       <img src="images9/friend4.jpg" width="360" height="450" usemap="#mapF4"> 
        <p>Підбирання комплектуючих</p>
        <p>Комп'ютерні ігри, CS2,Dota 2</p>
    </div>

</div>
</body>
</html>
