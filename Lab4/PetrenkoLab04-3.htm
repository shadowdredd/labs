<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Петренко — Лабораторна 04-3</title>
</head>
<body bgcolor="#ffffff">

    <h2 align="center">Рядки з текстом та рисунками, що біжать (вертикально)</h2>

    <!-- 1. Текст та рисунки коливаються вгору-вниз -->
    <div style="background-color: #ffd6d6; padding: 8px;">
        <marquee behavior="alternate" direction="up" height="80" scrollamount="3">
            <b>↕ Текст коливається вгору і вниз</b>
            &#9650; &#9660; &#9733; &#9733;
        </marquee>
    </div>

    <br>

    <!-- 2. Рисунки пробігають знизу догори та з'являються знову -->
    <div style="background-color: #d6ffd6; padding: 8px;">
        <marquee behavior="scroll" direction="up" height="100" scrollamount="4">
             Сонце &nbsp;&nbsp;
             Зірка &nbsp;&nbsp;
             Хмара &nbsp;&nbsp;
             Вогонь &nbsp;&nbsp;
        </marquee>
    </div>

    <br>

    <!-- 3. Рисунки пробігають згори донизу із зупинкою -->
    <div style="background-color: #d6d6ff; padding: 8px;">
        <marquee behavior="slide" direction="down" height="100" scrollamount="4">
            &#128640; Ракета &nbsp;
            &#128269; Пошук &nbsp;
            &#128187; Комп'ютер &nbsp;
            &#128161; Ідея
        </marquee>
    </div>

    <br>

    <!-- 4а. Повільне запізнення вертикально -->
    <div style="background-color: #fff3cd; padding: 8px;">
        <marquee behavior="scroll" direction="up" height="80" scrollamount="2" scrolldelay="200">
            <b>4а. Повільний рух вгору (scrolldelay=200)</b>
        </marquee>
    </div>

    <br>

    <!-- 4б. Швидке запізнення вертикально -->
    <div style="background-color: #ffe0f0; padding: 8px;">
        <marquee behavior="scroll" direction="up" height="80" scrollamount="2" scrolldelay="20">
            <b>4б. Швидкий рух вгору (scrolldelay=20)</b>
        </marquee>
    </div>

</body>
</html>
